<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- An "A" with its crossbar taken out and replaced by a single sun: two
       cream legs meeting at a sharp apex, and one warm point of light
       hanging where the bar would be (the sun palette, hot core to rim).
       Sits on the site's pitch-black ground so it reads the same in light
       and dark browser chrome. -->
  <defs>
    <radialGradient id="sun" cx="31" cy="40" r="4" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe800"/>
      <stop offset=".45" stop-color="#ffc400"/>
      <stop offset="1" stop-color="#ff8a00"/>
    </radialGradient>
    <radialGradient id="glow" cx="32" cy="41" r="10" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff8a00" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ff4d0d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#000"/>
  <circle cx="32" cy="41" r="10" fill="url(#glow)"/>
  <path d="M32 12 L48 50 H41.5 L32 27.4 L22.5 50 H16 Z" fill="#f4ede4"/>
  <circle cx="32" cy="41" r="3.6" fill="url(#sun)"/>
</svg>
