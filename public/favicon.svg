<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- "Aᴰ" — a bold white A with a small superscript D (Aditya Dave), on a
       black tile. The tile is barely lifted at the top-left and has a thin
       lit edge so it holds its shape on a dark tab bar; the letters carry
       a soft white-to-pearl gradient. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#26262b"/>
      <stop offset=".55" stop-color="#0b0b0d"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="ink" x1="10" y1="14" x2="50" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".6" stop-color="#f1f1f4"/>
      <stop offset="1" stop-color="#c9cad1"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#tile)"/>
  <rect x=".5" y=".5" width="63" height="63" rx="13.5" fill="none" stroke="url(#edge)"/>
  <g fill="url(#ink)" fill-rule="evenodd" transform="translate(32 32) scale(1.1) translate(-31 -32)">
    <!-- A: flat-cut top, left leg a touch lighter than the right -->
    <path d="M22.5 16 H29.5 L42 48 H33 L30.27 41 H20.73 L18 48 H10 Z M25.5 28.8 L28.51 36.5 H22.49 Z"/>
    <!-- superscript D, tucked in close with its top on the A's cap line -->
    <path d="M43.5 16 H46.5 A5.5 5.5 0 0 1 46.5 27 H43.5 Z M46.2 18.6 H46.5 A2.9 2.9 0 0 1 46.5 24.4 H46.2 Z"/>
  </g>
</svg>
